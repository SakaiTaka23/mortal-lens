<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 490">
  <defs>
    <linearGradient id="tileFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f3ea"/>
      <stop offset="100%" style="stop-color:#e4ddd0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e85040"/>
      <stop offset="100%" style="stop-color:#c02828"/>
    </linearGradient>
  </defs>
  
  <!-- ===== MAHJONG TILE ===== -->
  <!-- 3D edges -->
  <path d="M280,8 L290,16 L290,478 L280,470 Z" fill="#8a8070" opacity="0.7"/>
  <path d="M10,470 L20,478 L290,478 L280,470 Z" fill="#7a7060" opacity="0.6"/>
  <!-- Tile face -->
  <rect x="10" y="2" width="270" height="468" rx="16" ry="16" fill="url(#tileFace)"/>
  <rect x="10" y="2" width="270" height="468" rx="16" ry="16" fill="none" stroke="#ccc4b4" stroke-width="1.5"/>
  <!-- Inner border -->
  <rect x="26" y="18" width="238" height="436" rx="10" ry="10" fill="none" stroke="#d5cec0" stroke-width="1"/>
  
  <!-- ===== Eye of Analysis ===== -->
  <circle cx="145" cy="236" r="50" fill="none" stroke="url(#accentGrad)" stroke-width="9"/>
  <circle cx="145" cy="236" r="16" fill="url(#accentGrad)"/>
  <path d="M50,236 Q98,158 145,150 Q192,158 240,236" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>
  <path d="M50,236 Q98,314 145,322 Q192,314 240,236" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>
  <line x1="145" y1="150" x2="145" y2="124" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="145" y1="348" x2="145" y2="322" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="24" y1="236" x2="50" y2="236" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="240" y1="236" x2="266" y2="236" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Corner marks -->
  <circle cx="46" cy="38" r="3.5" fill="#ccc4b4"/>
  <circle cx="244" cy="38" r="3.5" fill="#ccc4b4"/>
  <circle cx="46" cy="434" r="3.5" fill="#ccc4b4"/>
  <circle cx="244" cy="434" r="3.5" fill="#ccc4b4"/>
</svg>
